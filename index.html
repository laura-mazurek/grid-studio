<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grid Studio">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Grid Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine Handy-breite App-Spalte; am Laptop als Telefon-Rahmen mittig auf ruhigem Hintergrund */
:root{
  --desk:#E7E8EE; --bg:#FBFAFC; --surface:#FFFFFF; --ink:#1D1B22; --muted:#77727F; --line:#E4E2E8;
  --chip:#EEECF1; --accent:#6A3C6E; --plan:#2F6F62; --plan-ink:#FFFFFF; --frame:#121116; --danger:#B3261E;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0E0D11; --bg:#18171C; --surface:#222027; --ink:#F1EEF4; --muted:#A39FAD; --line:#33303A;
  --chip:#2C2932; --accent:#C9A3CD; --plan:#5FB3A0; --plan-ink:#0D1F1B; --frame:#000000; --danger:#F2867E; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0E0D11; --bg:#18171C; --surface:#222027; --ink:#F1EEF4; --muted:#A39FAD; --line:#33303A;
  --chip:#2C2932; --accent:#C9A3CD; --plan:#5FB3A0; --plan-ink:#0D1F1B; --frame:#000000; --danger:#F2867E; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{height:100%;display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:640px) and (min-height:620px){
  body{background:var(--desk)}
  .shell{align-items:center;padding-block:20px;box-sizing:border-box}
  .app{max-width:410px;height:min(880px,100%);border-radius:40px;border:11px solid var(--frame);box-shadow:0 30px 70px -30px rgba(20,10,30,.5)}
}

/* Kopf */
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px}
.head h1{font-family:var(--display);font-size:20px;font-weight:700;margin:0;line-height:1.1}
.head small{display:block;color:var(--muted);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;font-size:12px;font-weight:600}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Feed */
.feed{flex:1;overflow-y:auto;padding:0 1px 10px;overscroll-behavior:contain}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;min-height:120px}
.tile{aspect-ratio:3/4;max-width:100%;position:relative;background:var(--chip) center/cover no-repeat;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile.planned{cursor:pointer}
.tile.planned::after{content:"";position:absolute;inset:0;border:2px solid var(--plan);pointer-events:none}
.tile .date{position:absolute;left:4px;bottom:4px;background:var(--plan);color:var(--plan-ink);font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;font-variant-numeric:tabular-nums;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .stack{position:absolute;right:6px;top:6px;width:16px;height:16px;pointer-events:none}
.tile .stack::before,.tile .stack::after{content:"";position:absolute;border:1.6px solid #fff;border-radius:3px;width:11px;height:11px;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.tile .stack::before{left:0;top:4px}.tile .stack::after{left:4px;top:0}
.tile .num{position:absolute;left:5px;top:5px;min-width:22px;height:22px;border-radius:11px;background:#fff;color:#1D1B22;font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.posting .tile:not(.planned){opacity:.4}
.sortable-ghost{opacity:.3}
.sortable-chosen.tile{transform:scale(1.04);box-shadow:0 10px 24px rgba(0,0,0,.3);z-index:2}
.empty{grid-column:1/-1;padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:6px}
.addposted{display:block;margin:12px auto 4px;border:1px dashed var(--line);background:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted)}

/* Album-Leiste */
.tray{border-top:1px solid var(--line);background:var(--surface);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.tray.dropping{outline:2px dashed var(--accent);outline-offset:-6px}
.albums{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.albums::-webkit-scrollbar{display:none}
.albums button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.albums button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.albums .add{color:var(--accent);border-style:dashed}
.strip{display:flex;gap:4px;overflow-x:auto;padding:0 12px;min-height:80px}
.strip .ph{flex:none;width:60px;aspect-ratio:3/4;border-radius:6px;background:var(--chip) center/cover no-repeat;position:relative;cursor:grab;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.strip .ph.used::after{content:"✓";position:absolute;right:3px;bottom:3px;width:16px;height:16px;border-radius:50%;background:var(--plan);color:var(--plan-ink);font-size:10px;font-weight:700;display:grid;place-items:center}
.strip .none{color:var(--muted);font-size:13px;align-self:center;padding:0 2px}
.trayfoot{display:flex;justify-content:space-between;gap:8px;padding:6px 12px 0;font-size:11px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;font-size:11px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.linkbtn.warn{color:var(--danger)}

/* Overlays */
.sheet{position:absolute;inset:64px 0 0 0;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);transform:translateY(102%);transition:transform .26s ease;display:flex;flex-direction:column;z-index:5}
.sheet.open{transform:none}
.sheet.with-tray{bottom:var(--tray-h,150px);border-radius:22px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px;gap:8px}
.sheet-head b{font-family:var(--display);font-size:17px}
.pill{border:0;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px}
.sheet-body{flex:1;overflow-y:auto;padding-bottom:12px}
.preview{margin:4px auto 0;width:min(62%,240px);aspect-ratio:3/4;border-radius:10px;background:var(--chip) center/cover no-repeat;position:relative;touch-action:none;cursor:move;overflow:hidden}
.preview .tag{position:absolute;left:6px;top:6px;background:rgba(18,17,22,.72);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px;pointer-events:none}
.preview .tip{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:11px;padding:16px 8px 6px;text-align:center;pointer-events:none}
.slides{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;min-height:92px}
.slides .ph{flex:none;width:58px;aspect-ratio:3/4;border-radius:6px;background:var(--chip) center/cover no-repeat;position:relative;cursor:grab;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.slides .ph.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.slides .ph .n{position:absolute;left:3px;top:3px;background:#fff;color:#1D1B22;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;font-variant-numeric:tabular-nums}
.slides .ph .x{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:12px;line-height:20px;padding:0}
.slides .dropzone{flex:none;width:58px;aspect-ratio:3/4;border-radius:6px;border:1.5px dashed var(--line);color:var(--muted);font-size:10px;display:grid;place-items:center;text-align:center;padding:4px;box-sizing:border-box}
.fields{display:grid;gap:8px;padding:0 14px}
.fields label{font-size:12px;font-weight:600;color:var(--muted);display:grid;gap:4px}
.fields textarea,.fields input,.dialog input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:14px var(--body);background:var(--bg);color:var(--ink)}
.fields textarea{resize:vertical;min-height:70px}
.actions{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.btn.primary{background:var(--plan);border-color:var(--plan);color:var(--plan-ink)}
.btn.warn{color:var(--danger)}

.dialog-back{position:absolute;inset:0;background:rgba(10,8,14,.45);display:grid;place-items:center;z-index:8;padding:20px}
.dialog{background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:320px;display:grid;gap:10px;box-sizing:border-box}
.dialog b{font-family:var(--display);font-size:17px}
.dialog p{margin:0;font-size:13px;color:var(--muted)}

.export{position:absolute;inset:0;background:var(--bg);z-index:7;display:flex;flex-direction:column}
.export .list{flex:1;overflow-y:auto;padding:0 14px 20px;display:grid;gap:14px;align-content:start}
.export figure{margin:0;display:grid;gap:4px}
.export img{width:100%;border-radius:8px;display:block}
.export figcaption{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.export figcaption a{color:var(--accent);font-weight:600}
.export .note{font-size:13px;color:var(--muted);padding:0 14px 10px;margin:0}
.toast{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:999px;z-index:9;white-space:nowrap;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.headr{display:flex;align-items:center;gap:6px}
.views{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.views button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.views button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.views .add{border-style:dashed;color:var(--accent)}
.dialog .stackbtns{display:grid;gap:6px}
.dialog a.btn{text-align:center;text-decoration:none;color:var(--ink)}
.tile.hidden{opacity:.35}
.tile .pin{position:absolute;left:5px;top:5px;width:22px;height:22px;border-radius:50%;background:rgba(18,17,22,.75);display:grid;place-items:center}
.tile .pin svg{width:13px;height:13px}
.tile .eye{position:absolute;right:5px;bottom:5px;background:rgba(18,17,22,.75);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.feedfoot{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px 8px 4px}
.feedfoot .addposted{margin:0}
.views .exp{color:var(--ink)}
.dialog .stackbtns small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.iconbtn{border:0;background:var(--chip);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;padding:0;position:relative}
.iconbtn svg{width:18px;height:18px}
.iconbtn .dot{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.iconbtn .dot.ok{background:var(--plan)}.iconbtn .dot.bad{background:var(--danger)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dialog.wide{max-width:380px;max-height:86%;overflow-y:auto}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;font-size:13px;line-height:1.45}
.steps a{color:var(--accent);font-weight:600}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{width:auto;margin-top:2px}
.err{color:var(--danger)!important}
/* ---------- Board: breite Arbeitsansicht ---------- */
body.boardmode{background:var(--bg)}
body.boardmode .shell{padding:0}
body.boardmode .app{max-width:none;height:100%;border:0;border-radius:0;box-shadow:none}
.headbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;font-size:12px;font-weight:700}
body.boardmode .headbtn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
body.boardmode .seg{display:none}
.board{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 250px;border-top:1px solid var(--line)}
.bcol{min-width:0;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 40px 16px;display:flex;flex-direction:column;gap:14px}
.bcol + .bcol{border-left:1px solid var(--line)}
.bcol h2{font-family:var(--display);font-size:17px;margin:0;display:flex;align-items:baseline;gap:8px}
.bcol h2 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
@media (max-width:1150px){.board{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.bprev{display:none}}
@media (max-width:760px){.board{display:block;overflow-y:auto}.bcol{overflow:visible}.bcol + .bcol{border-left:0;border-top:1px solid var(--line)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips .add{border-style:dashed;color:var(--accent)}
.crow{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;display:grid;gap:8px}
.crow-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crow-head input{flex:1;min-width:120px;border:0;background:none;font:700 15px var(--display);color:var(--ink);padding:2px 0}
.crow-head input:focus{outline:none;border-bottom:1.5px solid var(--accent)}
.crow-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.crow-meta.warn{color:var(--danger);font-weight:700}
.minibtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600}
.minibtn.go{background:var(--plan);border-color:var(--plan);color:var(--plan-ink)}
.minibtn.warn{color:var(--danger)}
.bslides{display:flex;gap:6px;overflow-x:auto;min-height:118px;padding:2px 2px 6px;align-items:flex-start}
.bslides:empty::before{content:"Bilder hierher ziehen";color:var(--muted);font-size:12px;align-self:center;padding-left:6px}
.bs{flex:none;width:86px;aspect-ratio:4/5;border-radius:6px;background:var(--chip) center/cover no-repeat;position:relative;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bs .n{position:absolute;left:4px;top:4px;background:#fff;color:#1D1B22;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;font-variant-numeric:tabular-nums}
.bs .x{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:12px;line-height:20px;padding:0;display:none}
.bs:hover .x,.bs:focus-within .x{display:block}
@media (hover:none){.bs .x{display:block}}
.cstrip{display:flex;height:6px;border-radius:3px;overflow:hidden}
.cstrip span{flex:1}
.newrow{border:1.5px dashed var(--line);border-radius:14px;min-height:96px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:10px;gap:6px;flex-wrap:wrap}
.newrow .bph{display:none}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.bph{aspect-ratio:4/5;border-radius:6px;background:var(--chip) center/cover no-repeat;position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bph.used{opacity:.4}
.bph.sel{box-shadow:0 0 0 3px var(--accent)}
.bph .sn{position:absolute;left:5px;top:5px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-sizing:border-box}
.bph .fav{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(18,17,22,.45);color:#fff;font-size:13px;line-height:26px;padding:0}
.bph .fav.on{background:#fff;color:#C2185B}
.selbar{position:sticky;top:-16px;z-index:2;background:var(--bg);padding:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.mgrid div{aspect-ratio:3/4;background:var(--chip) center/cover no-repeat;position:relative}
.mgrid div.planned::after{content:"";position:absolute;inset:0;border:2px solid var(--plan)}
.mgrid div.mine::after{border-color:var(--accent);border-width:3px}
.bhint{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
/* Karussell-Vorschau */
.igprev{position:absolute;inset:0;z-index:9;background:rgba(10,8,14,.82);display:grid;place-items:center;padding:16px;overflow-y:auto}
.igcard{background:#fff;color:#111;width:min(420px,100%);border-radius:14px;overflow:hidden}
.igtop{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;font-size:13px}
.igtop i{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#F9CE34,#EE2A7B,#6228D7)}
.igtop .sp{flex:1}
.igtop button{border:1px solid #ddd;background:#fff;border-radius:6px;font-size:11px;padding:3px 7px;color:#111}
.igslide{position:relative;background:#111 center/cover no-repeat;touch-action:pan-y}
.igslide .nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#111;font-size:16px}
.igslide .prev{left:8px}.igslide .next{right:8px}
.igslide .cnt{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
.igdots{display:flex;justify-content:center;gap:4px;padding:10px}
.igdots span{width:6px;height:6px;border-radius:50%;background:#ccc}
.igdots span.on{background:#0095F6}
.igcap{padding:0 12px 14px;font-size:13px;line-height:1.4;white-space:pre-wrap}
.igclose{display:block;margin:12px auto 0;border:0;background:#fff;color:#111;border-radius:999px;padding:8px 18px;font-weight:700}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.iconbtn.spin svg{animation:none}}
</style>
</head>
<body>

<div class="shell"><div class="app" id="app">
  <div class="head">
    <div><h1>Grid Studio</h1><small id="stats">lädt …</small></div>
    <div class="headr">
      <button class="headbtn" id="boardBtn">Board</button>
      <div class="seg" role="group" aria-label="Ansicht">
        <button id="modeGrid" aria-pressed="true">Grid</button>
        <button id="modePost" aria-pressed="false">Posting</button>
      </div>
      <button class="iconbtn" id="igBtn" aria-label="Instagram-Verbindung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></svg><span class="dot" id="igDot"></span></button>
    </div>
  </div>

  <div class="views" id="views" role="group" aria-label="Reihenfolge"></div>
  <div class="board" id="board" hidden></div>

  <div class="feed" id="feed">
    <div class="grid" id="grid"></div>
    <div class="feedfoot">
      <button class="addposted" id="addPosted">＋ Gepostete Bilder von Hand</button>
      <button class="addposted" id="toggleHidden" hidden></button>
      <button class="addposted" id="transferBtn">☁︎ Geräte synchronisieren</button>
    </div>
  </div>

  <div class="tray" id="tray">
    <div class="albums" id="albums"></div>
    <div class="strip" id="strip"></div>
    <div class="trayfoot"><span id="hint">Foto nach oben ziehen = neuer Post</span><button class="linkbtn" id="delAlbum" hidden>Album entfernen</button></div>
  </div>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-head"><b id="sheetTitle">Post</b><button class="pill" id="closeSheet">Fertig</button></div>
    <div class="sheet-body">
      <div class="preview" id="preview"><span class="tag" id="previewTag">Cover · so im Grid</span><span class="tip">Ziehen, um den Ausschnitt zu verschieben</span></div>
      <div class="slides" id="slides"></div>
      <div class="fields">
        <label for="caption">Caption<textarea id="caption" placeholder="Caption schreiben …"></textarea></label>
        <label for="when">Geplant für<input id="when" type="datetime-local"></label>

        <button class="btn primary" id="doExport">Slides exportieren</button>

  </div>

  <input type="file" id="fileAlbum" accept="image/*" multiple hidden>
  <input type="file" id="filePosted" accept="image/*" multiple hidden>
  <input type="file" id="fileBackup" hidden>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const app = $("#app"), grid = $("#grid"), strip = $("#strip"), slidesEl = $("#slides");
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- Speicher (IndexedDB) ---------- */
let db = null;
function openDB(){
  return new Promise(res => {
    try{
      const r = indexedDB.open("grid-studio", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("img"); r.result.createObjectStore("kv"); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
function idb(store, mode, fn){
  return new Promise(res => {
    if(!db) return res(undefined);
    try{
      const tx = db.transaction(store, mode), st = tx.objectStore(store), r = fn(st);
      tx.oncomplete = () => res(r && r.result); tx.onerror = () => res(undefined);
    }catch(e){ res(undefined); }
  });
}
const putImg = (id, v) => idb("img", "readwrite", s => s.put(v, id));
const getImg = id => idb("img", "readonly", s => s.get(id));
const delImg = id => idb("img", "readwrite", s => s.delete(id));
const allImgKeys = () => idb("img", "readonly", s => s.getAllKeys());
let saveTimer;
// fromRemote/quiet: nur lokal speichern, ohne die Änderung als „neuer Stand“ zu markieren
function save(quiet){ if(!quiet){ state.updatedAt = Date.now(); schedulePush(); } clearTimeout(saveTimer); saveTimer = setTimeout(() => idb("kv", "readwrite", s => s.put(JSON.stringify(state), "state")), 80); }
// Beim Schließen oder Wechseln der App sofort speichern, statt auf den Timer zu warten
function flush(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; idb("kv", "readwrite", s => s.put(JSON.stringify(state), "state")); } }
addEventListener("pagehide", flush);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flush(); });

/* ---------- Zustand ---------- */
// posts[0] = oben links im Grid. slides[0] = Cover.
let state = {albums: [], photos: {}, posts: [], current: null};
let postingMode = false, openPost = null, selSlide = 0, gridSort = null, showHidden = false;
const thumbs = {};          // pid -> objectURL
const fullURLs = {};        // pid -> objectURL (nur bei Bedarf)

async function thumbURL(pid){
  if(thumbs[pid]) return thumbs[pid];
  let rec = await getImg(pid);
  if(!rec && state.photos[pid] && state.photos[pid].synced) rec = await pullImg(pid);
  if(rec && rec.thumb) thumbs[pid] = URL.createObjectURL(rec.thumb);
  else if(state.photos[pid] && state.photos[pid].remote) return state.photos[pid].remote;
  return thumbs[pid];
}
async function fullURL(pid){
  if(fullURLs[pid]) return fullURLs[pid];
  let rec = await getImg(pid);
  if(!rec && state.photos[pid] && state.photos[pid].synced) rec = await pullImg(pid);
  if(rec && rec.full) fullURLs[pid] = URL.createObjectURL(rec.full);
  return fullURLs[pid] || thumbs[pid];
}

/* ---------- Bilder einlesen ---------- */
function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => res({im, url}); im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}
function scaled(im, maxSide, q){
  const s = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", q));
}
async function ingest(files, album, onProgress){
  const ids = [];
  let i = 0;
  for(const f of files){
    i++;
    if(!f.type.startsWith("image/")) continue;
    try{
      const {im, url} = await loadImage(f);
      const [full, thumb] = await Promise.all([scaled(im, 2160, .9), scaled(im, 480, .8)]);
      URL.revokeObjectURL(url);
      const id = uid();
      await putImg(id, {full, thumb}); localKeys.add(id);
      thumbs[id] = URL.createObjectURL(thumb);
      state.photos[id] = {album, w: im.naturalWidth, h: im.naturalHeight};
      ids.push(id);
    }catch(e){ /* Datei übersprungen */ }
    onProgress && onProgress(i, files.length);
  }
  return ids;
}

/* ---------- Anzeige ---------- */
function usedIds(){ const s = new Set(); state.posts.forEach(p => p.slides.forEach(x => s.add(x.pid))); return s; }
function fmtDate(v){
  if(!v) return "geplant";
  const d = new Date(v); if(isNaN(d)) return "geplant";
  return d.toLocaleDateString("de-AT", {weekday:"short", day:"2-digit", month:"2-digit"});
}
function bg(el, pid, fx = .5, fy = .5){
  el.style.backgroundPosition = `${fx*100}% ${fy*100}%`;
  if(thumbs[pid]) el.style.backgroundImage = `url("${thumbs[pid]}")`;
  else thumbURL(pid).then(u => { if(u) el.style.backgroundImage = `url("${u}")`; });
}

function renderStats(){
  const pl = state.posts.filter(p => p.status === "planned").length, hid = state.posts.filter(p => p.hidden).length;
  const ig = state.ig;
  $("#stats").textContent = `${ig && ig.user ? "@" + ig.user + " · " : ""}${pl} geplant · ${state.posts.length - pl - hid} gepostet${syncLabel()}`;
  const th = $("#toggleHidden");
  th.hidden = !hid; th.textContent = showHidden ? "Ausgeblendete verstecken" : `${hid} ausgeblendet · zeigen`;
  const dot = $("#igDot");
  dot.className = "dot" + (ig && ig.token ? (ig.error ? " bad" : " ok") : "");
}

/* ---------- Ansichten & Versionen ---------- */
// „new“ = automatisch nach Datum, „ig“ = echte Instagram-Reihenfolge (einmal von Hand gelegt,
// die API verrät sie nicht), alle weiteren = frei bearbeitbare Versionen. Jede speichert nur die Reihenfolge der Post-IDs.
const byDate = (a, b) => (b.when || "").localeCompare(a.when || "");
function layout(id){ return state.layouts.find(l => l.id === id); }
function ensureLayouts(){
  if(!Array.isArray(state.layouts)) state.layouts = [];
  if(!layout("ig")) state.layouts.unshift({id: "ig", name: "Instagram", order: state.posts.map(p => p.id)});
  if(!state.layoutsInit){ state.layoutsInit = true; if(state.layouts.length < 2) state.layouts.push({id: uid(), name: "Version 1", order: state.posts.map(p => p.id)}); }
  if(state.view !== "new" && !layout(state.view)) state.view = state.layouts[1] ? state.layouts[1].id : "ig";
}
function orderOf(l){
  const map = new Map(state.posts.map(p => [p.id, p])), seen = new Set(), out = [];
  l.order.forEach(id => { const p = map.get(id); if(p && !seen.has(id)){ seen.add(id); out.push(p); } });
  state.posts.forEach(p => { if(!seen.has(p.id)) out.push(p); });
  return out;
}
function viewPosts(){
  const base = allViewPosts();
  const all = [...base.filter(p => p.pinned).sort((a, b) => b.pinned - a.pinned), ...base.filter(p => !p.pinned)];
  return showHidden ? all : all.filter(p => !p.hidden);
}
function allViewPosts(){
  if(state.view === "new"){
    const planned = orderOf(layout("ig")).filter(p => p.status === "planned");
    return [...planned, ...state.posts.filter(p => p.status !== "planned").sort(byDate)];
  }
  return orderOf(layout(state.view));
}
// Neuen Post in alle Ansichten einsortieren: in der aktuellen an die Ablagestelle, sonst geplante ganz oben,
// gepostete direkt unter die geplanten (wie in Instagram) oder auf Wunsch ans Ende.
function placePost(p, index, atEnd){
  state.layouts.forEach(l => {
    const ids = orderOf(l).map(x => x.id).filter(id => id !== p.id);
    let at;
    if(l.id === state.view && index != null) at = Math.min(index, ids.length);
    else if(atEnd) at = ids.length;
    else if(p.status === "planned") at = 0;
    else{ at = ids.findIndex(id => { const q = postById(id); return q && q.status !== "planned"; }); if(at < 0) at = ids.length; }
    ids.splice(at, 0, p.id); l.order = ids;
  });
}
function swapPost(oldId, newId){ state.layouts.forEach(l => { const i = l.order.indexOf(oldId); if(i >= 0) l.order[i] = newId; }); }
function resetToInstagram(l){
  const planned = orderOf(l).filter(p => p.status === "planned");
  l.order = [...planned, ...orderOf(layout("ig")).filter(p => p.status !== "planned")].map(p => p.id);
}

function renderViews(){
  const box = $("#views"); box.innerHTML = "";
  [{id: "new", name: "Neueste zuerst"}, ...state.layouts].forEach(v => {
    const b = document.createElement("button");
    const active = v.id === state.view;
    b.textContent = v.name + (active && v.id !== "new" ? " ⋯" : "");
    b.setAttribute("aria-pressed", active);
    b.onclick = () => {
      if(active){ if(v.id === "new") toast("Automatisch nach Datum, Verschieben geht in den anderen Ansichten"); else viewDialog(v); return; }
      state.view = v.id; save(); renderViews(); renderGrid();
    };
    box.appendChild(b);
  });
  const add = document.createElement("button");
  add.className = "add"; add.textContent = "＋ Version";
  add.onclick = () => {
    const l = {id: uid(), name: "Version " + state.layouts.length, order: []};
    resetToInstagram(l);
    state.layouts.push(l); state.view = l.id; save(); renderViews(); renderGrid();
    toast(`„${l.name}“ angelegt: Instagram-Reihenfolge, geplante oben`);
  };
  box.appendChild(add);
  const ex = document.createElement("button");
  ex.className = "exp"; ex.textContent = "⤓ Als Bild";
  ex.onclick = exportGrid;
  box.appendChild(ex);
  if(gridSort) gridSort.option("sort", state.view !== "new");
}

function viewDialog(l){
  const back = document.createElement("div"); back.className = "dialog-back";
  const close = () => back.remove();
  back.addEventListener("click", e => { if(e.target === back) close(); });
  if(l.id === "ig"){
    back.innerHTML = `<div class="dialog wide"><b>Instagram-Reihenfolge</b>
      <p>Hier liegt dein Profil so, wie es in Instagram wirklich aussieht. Instagram gibt die umsortierte Reihenfolge nicht heraus, deshalb schiebst du sie hier einmal zurecht. Neue Posts kommen beim Sync automatisch oben dazu.</p>
      <div class="stackbtns"><button class="btn primary" id="vCopy">Als neue Version kopieren<small>Startet mit genau dieser Reihenfolge</small></button>
      ${state.layouts.filter(x => x.id !== "ig").map(x => `<button class="btn" data-into="${x.id}">In „${x.name.replace(/[<>&"]/g, "")}“ kopieren<small>Überschreibt die Reihenfolge dieser Version</small></button>`).join("")}
      <button class="btn warn" id="vDelAll">Alle Versionen löschen<small>Nur die Versionen. Instagram-Ansicht und geplante Posts bleiben.</small></button>
      <button class="btn" id="vDate">Nach Datum ordnen<small>Gepostete Bilder neu nach Datum, geplante bleiben oben</small></button>
      <button class="btn" id="vClose">Schließen</button></div></div>`;
    back.querySelector("#vCopy").onclick = () => {
      const c = {id: uid(), name: "Version " + state.layouts.length, order: orderOf(l).map(p => p.id)};
      state.layouts.push(c); state.view = c.id; save(); renderViews(); renderGrid(); close(); toast(`„${c.name}“ angelegt`);
    };
    back.querySelectorAll("[data-into]").forEach(b => b.onclick = () => {
      const t = layout(b.dataset.into);
      if(!b.dataset.armed){ b.dataset.armed = "1"; b.firstChild.textContent = "Sicher? Nochmal tippen"; return; }
      t.order = orderOf(l).map(p => p.id); state.view = t.id; save(); renderViews(); renderGrid(); close(); toast(`In „${t.name}“ kopiert`);
    });
    const da = back.querySelector("#vDelAll");
    if(state.layouts.length < 2) da.hidden = true;
    da.onclick = () => {
      if(!da.dataset.armed){ da.dataset.armed = "1"; da.firstChild.textContent = "Sicher? Nochmal tippen"; return; }
      state.layouts = state.layouts.filter(x => x.id === "ig"); state.view = "ig";
      save(); renderViews(); renderGrid(); close(); toast("Alle Versionen gelöscht");
    };
    back.querySelector("#vDate").onclick = () => {
      const planned = orderOf(l).filter(p => p.status === "planned");
      l.order = [...planned, ...state.posts.filter(p => p.status !== "planned").sort(byDate)].map(p => p.id);
      save(); renderGrid(); close(); toast("Nach Datum geordnet");
    };
  }else{
    back.innerHTML = `<form class="dialog wide"><b>Version bearbeiten</b>
      <input id="vName" maxlength="30" aria-label="Name der Version">
      <div class="stackbtns">
        <button class="btn primary" type="submit">Namen speichern</button>
        <button class="btn" type="button" id="vReset">Auf Instagram zurücksetzen<small>Geplante Posts oben, darunter die echte Instagram-Reihenfolge</small></button>
        <button class="btn" type="button" id="vDup">Duplizieren</button>
        <button class="btn warn" type="button" id="vDel">Version löschen</button>
        <button class="btn" type="button" id="vClose">Schließen</button>
      </div></form>`;
    const name = back.querySelector("#vName"); name.value = l.name;
    back.querySelector("form").onsubmit = e => { e.preventDefault(); l.name = name.value.trim() || l.name; save(); renderViews(); close(); };
    back.querySelector("#vReset").onclick = () => { resetToInstagram(l); save(); renderGrid(); close(); toast("Auf Instagram-Reihenfolge zurückgesetzt"); };
    back.querySelector("#vDup").onclick = () => {
      const c = {id: uid(), name: l.name + " Kopie", order: orderOf(l).map(p => p.id)};
      state.layouts.push(c); state.view = c.id; save(); renderViews(); renderGrid(); close(); toast(`„${c.name}“ angelegt`);
    };
    const del = back.querySelector("#vDel");
    del.onclick = () => {
      if(!del.dataset.armed){ del.dataset.armed = "1"; del.textContent = "Sicher? Nochmal tippen"; return; }
      state.layouts = state.layouts.filter(x => x !== l); state.view = state.layouts[1] ? state.layouts[1].id : "ig";
      save(); renderViews(); renderGrid(); close(); toast("Version gelöscht");
    };
  }
  back.querySelector("#vClose").onclick = close;
  app.appendChild(back);
}

function postMenu(p){
  const back = document.createElement("div"); back.className = "dialog-back";
  const close = () => back.remove();
  back.addEventListener("click", e => { if(e.target === back) close(); });
  back.innerHTML = `<div class="dialog wide"><b>Geposteter Beitrag</b><p id="pmCap"></p>
    <div class="stackbtns">
      <button class="btn primary" id="pmPin"></button>
      <button class="btn" id="pmHide"></button>
      ${p.permalink ? '<a class="btn" id="pmOpen" target="_blank" rel="noopener">In Instagram ansehen ↗</a>' : ""}
      ${p.igId ? "" : '<button class="btn warn" id="pmDel">Aus Grid Studio entfernen</button>'}
      <button class="btn" id="pmClose">Schließen</button>
    </div></div>`;
  back.querySelector("#pmCap").textContent = (p.caption || "").slice(0, 120) || (p.when ? new Date(p.when).toLocaleDateString("de-AT") : "");
  const hb = back.querySelector("#pmHide");
  hb.innerHTML = p.hidden ? "Wieder im Grid zeigen" : "Im Grid ausblenden<small>z. B. Reels, die nicht im Raster erscheinen. Gilt für alle Ansichten.</small>";
  hb.onclick = () => { p.hidden = !p.hidden; save(); renderGrid(); close(); toast(p.hidden ? "Ausgeblendet" : "Wieder eingeblendet"); };
  const pb = back.querySelector("#pmPin");
  pb.innerHTML = p.pinned ? "Fixierung lösen" : "Oben fixieren<small>Wie „Anpinnen“ in Instagram, max. 3. Gilt für alle Ansichten.</small>";
  pb.onclick = () => {
    if(!p.pinned && state.posts.filter(x => x.pinned).length >= 3) return toast("Instagram erlaubt maximal 3 fixierte Posts");
    p.pinned = p.pinned ? 0 : Date.now(); save(); renderGrid(); close(); toast(p.pinned ? "Fixiert" : "Fixierung gelöst");
  };
  if(p.permalink) back.querySelector("#pmOpen").href = p.permalink;
  const del = back.querySelector("#pmDel");
  if(del) del.onclick = () => {
    if(!del.dataset.armed){ del.dataset.armed = "1"; del.textContent = "Sicher? Nochmal tippen"; return; }
    state.posts = state.posts.filter(x => x !== p); save(); renderGrid(); close(); toast("Entfernt");
  };
  back.querySelector("#pmClose").onclick = close;
  app.appendChild(back);
}

// Aktuelle Ansicht als JPEG (1080 px breit), zum Vergleichen am Handy
function loadForCanvas(pid){
  return new Promise(async res => {
    const ph = state.photos[pid] || {};
    const local = thumbs[pid] && !thumbs[pid].startsWith("http") ? thumbs[pid] : (await thumbURL(pid));
    const src = local || ph.remote;
    if(!src) return res(null);
    const im = new Image();
    if(src.startsWith("http")) im.crossOrigin = "anonymous";
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = src;
  });
}
async function exportGrid(){
  const list = viewPosts().filter(p => !p.hidden).slice(0, 45);
  if(!list.length) return toast("Noch nichts im Grid");
  toast("Bild wird erstellt …");
  const W = 1080, gap = 4, tw = (W - 2 * gap) / 3, th = tw * 4 / 3, rows = Math.ceil(list.length / 3);
  const c = document.createElement("canvas"); c.width = W; c.height = Math.round(rows * th + (rows - 1) * gap);
  const g = c.getContext("2d"); g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, c.width, c.height);
  let missing = 0;
  const ims = await Promise.all(list.map(p => p.slides[0] ? loadForCanvas(p.slides[0].pid) : null));
  list.forEach((p, i) => {
    const x = (i % 3) * (tw + gap), y = Math.floor(i / 3) * (th + gap), im = ims[i], s = p.slides[0] || {fx: .5, fy: .5};
    if(im){
      const iw = im.naturalWidth, ih = im.naturalHeight, sc = Math.max(tw / iw, th / ih), sw = tw / sc, sh = th / sc;
      g.drawImage(im, (iw - sw) * s.fx, (ih - sh) * s.fy, sw, sh, x, y, tw, th);
    }else{ missing++; g.fillStyle = "#E4E2E8"; g.fillRect(x, y, tw, th); }
    if(p.status === "planned"){ g.strokeStyle = "#2F6F62"; g.lineWidth = 8; g.strokeRect(x + 4, y + 4, tw - 8, th - 8); }
  });
  let blob;
  try{ blob = await new Promise(r => c.toBlob(r, "image/jpeg", .9)); }catch(e){ blob = null; }
  if(!blob) return toast("Export nicht möglich: Instagram erlaubt das Kopieren der Bilder nicht");
  const name = (state.view === "new" ? "Neueste" : layout(state.view).name).replace(/[^\wäöüÄÖÜß -]/g, "");
  const file = new File([blob], `Grid ${name} ${new Date().toISOString().slice(0, 10)}.jpg`, {type: "image/jpeg"});
  if(missing) toast(`${missing} Bilder fehlen im Export (grau)`);
  try{
    if(navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file]}); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const u = URL.createObjectURL(file), ov = document.createElement("div"); ov.className = "export";
  ov.innerHTML = `<div class="sheet-head"><b>Grid als Bild</b><button class="pill">Schließen</button></div>
    <p class="note">Am iPhone: Bild lange drücken → „Zu Fotos hinzufügen“. Am Laptop: „Speichern“. Grüner Rahmen = geplant.</p>
    <div class="list"><figure><img alt="Grid"><figcaption><span></span><a>Speichern</a></figcaption></figure></div>`;
  ov.querySelector("img").src = u; ov.querySelector("figcaption span").textContent = file.name;
  const a = ov.querySelector("figcaption a"); a.href = u; a.download = file.name;
  ov.querySelector(".pill").onclick = () => { URL.revokeObjectURL(u); ov.remove(); };
  app.appendChild(ov);
}

function renderGrid(){
  if(state.board) renderBoard();
  grid.innerHTML = "";
  grid.classList.toggle("posting", postingMode);
  if(!state.posts.length){
    grid.innerHTML = `<div class="empty"><b>Dein Feed ist noch leer</b>Leg unten mit „＋ Album“ ein Album an und zieh ein Foto hier hoch. Deine bisherigen Posts holst du mit dem Button darunter dazu.</div>`;
  }
  const list = viewPosts();
  const planned = list.filter(p => p.status === "planned");
  list.forEach(p => {
    const t = document.createElement("div");
    t.className = "tile" + (p.status === "planned" ? " planned" : "");
    t.dataset.id = p.id;
    const c = p.slides[0];
    if(c) bg(t, c.pid, c.fx, c.fy);
    if(p.slides.length > 1 || p.count > 1) t.insertAdjacentHTML("beforeend", '<span class="stack"></span>');
    if(p.status === "planned"){
      const d = document.createElement("span"); d.className = "date"; d.textContent = fmtDate(p.when); t.appendChild(d);
      if(postingMode){
        // Zuerst wird der unterste geplante Post veröffentlicht, Instagram setzt neue Posts oben links an.
        const n = planned.length - planned.indexOf(p);
        t.insertAdjacentHTML("beforeend", `<span class="num">${n}</span>`);
      }
      t.addEventListener("click", () => openSheet(p.id));
    }else t.addEventListener("click", () => postMenu(p));
    if(p.pinned) t.insertAdjacentHTML("beforeend", '<span class="pin" title="Fixiert"><svg viewBox="0 0 24 24" fill="#fff"><path d="M15 3l6 6-3 1-4 4 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 4-4z"/></svg></span>');

(() => {
  const pv = $("#preview"); let start = null;
  pv.addEventListener("pointerdown", e => {
    if(!openPost) return;
    const s = openPost.slides[selSlide], ph = state.photos[s.pid];
    const r = pv.getBoundingClientRect();
    const scale = Math.max(r.width / ph.w, r.height / ph.h);
    start = {x: e.clientX, y: e.clientY, fx: s.fx, fy: s.fy, ox: ph.w*scale - r.width, oy: ph.h*scale - r.height};
    pv.setPointerCapture(e.pointerId);
  });
  pv.addEventListener("pointermove", e => {
    if(!start) return;
    const s = openPost.slides[selSlide];
    if(start.ox > 1) s.fx = Math.min(1, Math.max(0, start.fx - (e.clientX - start.x) / start.ox));
    if(start.oy > 1) s.fy = Math.min(1, Math.max(0, start.fy - (e.clientY - start.y) / start.oy));
    pv.style.backgroundPosition = `${s.fx*100}% ${s.fy*100}%`;
  });
  const end = () => { if(start){ start = null; save(); renderSheet(); } };
  pv.addEventListener("pointerup", end); pv.addEventListener("pointercancel", end);
})();

function cropBlob(pid, fx, fy){
  return fullURL(pid).then(u => new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const W = 1080, H = 1440, iw = im.naturalWidth, ih = im.naturalHeight;
      const sc = Math.max(W/iw, H/ih), sw = W/sc, sh = H/sc;
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const g = c.getContext("2d"); g.imageSmoothingQuality = "high";
      g.drawImage(im, (iw-sw)*fx, (ih-sh)*fy, sw, sh, 0, 0, W, H);
      c.toBlob(res, "image/jpeg", .92);
    };
    im.onerror = () => res(null);
    im.src = u;
  }));
}

    if(p.caption) await navigator.clipboard.writeText(p.caption).catch(() => {});

  });
}

/* ---------- Instagram-Sync ---------- */
// Instagram API mit Instagram-Login. Der Schlüssel bleibt nur auf diesem Gerät.
const IG = "https://graph.instagram.com/v21.0";
const DAY = 864e5;
let syncing = false;

async function igGet(url){
  const r = await fetch(url);
  const j = await r.json().catch(() => ({}));
  if(!r.ok || j.error){
    const e = new Error((j.error && j.error.message) || "Verbindung fehlgeschlagen (" + r.status + ")");
    e.code = j.error && j.error.code; throw e;
  }
  return j;
}
const norm = s => (s || "").toLowerCase().replace(/\s+/g, " ").trim().slice(0, 40);
function coverUrl(m){
  const c = m.children && m.children.data && m.children.data[0];
  if(m.media_type === "VIDEO") return m.thumbnail_url || m.media_url;
  return m.media_url || (c && (c.thumbnail_url || c.media_url)) || m.thumbnail_url;
}

function mergeIg(items, complete){
  const known = new Map(state.posts.filter(p => p.igId).map(p => [p.igId, p]));
  const firstSync = known.size === 0;
  if(firstSync && state.ig.replaceManual) state.posts = state.posts.filter(p => p.status === "planned" || p.igId);
  const fresh = [];
  items.forEach(m => {
    const pid = "ig_" + m.id, url = coverUrl(m);
    state.photos[pid] = Object.assign(state.photos[pid] || {w: 1080, h: 1350}, {album: "_ig", remote: url});
    if(thumbs[pid] && thumbs[pid].startsWith("http")) thumbs[pid] = url;
    const count = m.children && m.children.data ? m.children.data.length : 1;
    const p = known.get(m.id);
    if(p){ p.count = count; p.caption = m.caption || ""; p.permalink = m.permalink; }
    else fresh.push({id: uid(), igId: m.id, status: "posted", slides: [{pid, fx: .5, fy: .5}], count, caption: m.caption || "", when: m.timestamp, permalink: m.permalink});
  });
  if(complete){
    const live = new Set(items.map(m => m.id));
    state.posts = state.posts.filter(p => !p.igId || live.has(p.igId));
  }
  // Neu gepostet: passenden geplanten Entwurf (gleicher Caption-Anfang) an Ort und Stelle ersetzen
  const done = [];
  if(!firstSync){
    fresh.slice().reverse().forEach(f => {
      // Caption-Anfang vergleichen, damit nachträglich angehängte Emojis oder Hashtags nicht stören
      const a = norm(f.caption);
      const pl = a && state.posts.find(p => {
        const b = norm(p.caption);
        return p.status === "planned" && b.length >= 8 && (a.startsWith(b) || b.startsWith(a));
      });
      if(pl){ state.posts[state.posts.indexOf(pl)] = f; swapPost(pl.id, f.id); done.push(f); }
    });
  }
  // Rest kommt wie in Instagram oben über die bisherigen Posts, unter die geplanten (älteste zuerst, damit der neueste oben landet)
  fresh.filter(f => !done.includes(f)).reverse().forEach(f => { state.posts.push(f); placePost(f); });
  return {added: fresh.length, matched: done.length};
}

// Tokens aus dem Unified Login beginnen mit „EAA“. Je nach Konfiguration klappt der Zugriff über einen anderen Weg,
// daher der Reihe nach probieren und den funktionierenden merken.
async function resolveTarget(ig){
  if(!ig.token.startsWith("EAA")) return {base: IG, who: "me"};
  if(ig.base && ig.who) return {base: ig.base, who: ig.who};
  const FB = "https://graph.facebook.com/v21.0", tok = encodeURIComponent(ig.token), tries = [];
  // „Ungültiger Token“ (190) ist nur bei Facebook endgültig; graph.instagram.com lehnt EAA-Tokens ggf. genauso ab
  const attempt = async (label, fn, fatal = true) => {
    try{ return await fn(); }
    catch(e){ if(fatal && e.code === 190) throw e; tries.push(`${label}: ${e.message}`); return null; }
  };
  let r = await attempt("Instagram-Login", async () => { await igGet(`${IG}/me?fields=username&access_token=${tok}`); return {base: IG, who: "me"}; }, false);
  if(!r && ig.igId) r = await attempt("Konto-ID", async () => { await igGet(`${FB}/${encodeURIComponent(ig.igId)}?fields=username&access_token=${tok}`); return {base: FB, who: encodeURIComponent(ig.igId)}; });
  if(!r) r = await attempt("Facebook-Seite", async () => {
    const j = await igGet(`${FB}/me/accounts?fields=instagram_business_account,access_token&access_token=${tok}`);
    const a = (j.data || []).find(x => x.instagram_business_account);
    if(!a) throw new Error("keine Facebook-Seite mit Instagram-Konto gefunden");
    // Seiten-Token aus einem verlängerten Nutzer-Token läuft nicht ab, also diesen merken
    if(a.access_token) ig.token = a.access_token;
    return {base: FB, who: a.instagram_business_account.id};
  });
  if(!r) throw new Error("Meta erlaubt mit diesem Token keinen Zugriff auf deine Posts. Antworten: " + tries.join(" · "));
  ig.base = r.base; ig.who = r.who;
  return r;
}

async function igSync(silent){
  const ig = state.ig;
  if(!ig || !ig.token || syncing) return false;
  syncing = true; $("#igBtn").classList.add("spin");
  try{
    const tok = encodeURIComponent(ig.token);
    const {base, who} = await resolveTarget(ig);
    const me = await igGet(`${base}/${who}?fields=username&access_token=${tok}`);
    ig.user = me.username;
    let url = `${base}/${who}/media?fields=id,caption,media_type,media_url,thumbnail_url,permalink,timestamp,children{media_type,media_url,thumbnail_url}&limit=50&access_token=${tok}`;
    const items = [];
    for(let page = 0; page < 30 && url; page++){
      const j = await igGet(url);
      items.push(...(j.data || []));
      url = j.paging && j.paging.next;
    }
    const r = mergeIg(items, !url);
    ig.lastSync = Date.now(); ig.error = "";
    save(!(r.added || r.matched)); renderGrid(); renderStrip();
    if(r.matched) toast(r.matched === 1 ? "Geplanter Post ist jetzt online ✓" : `${r.matched} geplante Posts sind online ✓`);
    else if(!silent) toast(r.added ? `${r.added} Posts von Instagram geladen` : "Alles aktuell");
    return true;
  }catch(e){
    ig.error = e.code === 190 ? "Der Instagram-Schlüssel ist abgelaufen. Bitte neu verbinden." : e.message;
    save();
    if(!silent || e.code === 190) toast(e.code === 190 ? "Instagram neu verbinden" : "Sync fehlgeschlagen");
    return false;
  }finally{
    syncing = false; $("#igBtn").classList.remove("spin"); renderStats();
  }
}

async function igRefresh(){
  const ig = state.ig;
  if(!ig || !ig.token || ig.token.startsWith("EAA") || Date.now() - (ig.tokenAt || 0) < 3 * DAY) return;
  try{
    const j = await igGet(`https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${encodeURIComponent(ig.token)}`);
    ig.token = j.access_token; ig.tokenAt = Date.now(); ig.exp = Date.now() + (j.expires_in || 60 * 86400) * 1000;
    save();
  }catch(e){ /* nächster Versuch beim nächsten Öffnen */ }
}
async function igAuto(){
  const ig = state.ig;
  if(!ig || !ig.token) return;
  await igRefresh();
  if(!ig.lastSync || Date.now() - ig.lastSync > 5 * 60e3) igSync(true);
}

// Jede Reihe ist ein geplanter Post mit album = aktuelles Album. Pool = alle Fotos des Albums.
let boardFilter = "all", boardSorts = [];
const boardSel = new Set();
function boardPosts(){ return state.posts.filter(p => p.status === "planned" && p.album && p.album === state.current); }

function avgColor(pid, el){
  const ph = state.photos[pid];
  if(!ph) return;
  if(ph.c){ el.style.background = ph.c; return; }
  thumbURL(pid).then(u => {
    if(!u || u.startsWith("http")) return;
    const im = new Image();
    im.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = 1;
      const g = c.getContext("2d"); g.drawImage(im, 0, 0, 1, 1);
      const d = g.getImageData(0, 0, 1, 1).data;
      ph.c = `rgb(${d[0]},${d[1]},${d[2]})`; el.style.background = ph.c; save(true);
    };
    im.src = u;
  });
}

// Fotos endgültig aus dem Album entfernen, auch aus Karussells; leere Karussells fallen weg
function deletePhotos(ids){
  const set = new Set(ids);
  state.posts.forEach(p => { if(p.slides.some(sl => set.has(sl.pid))) p.slides = p.slides.filter(sl => !set.has(sl.pid)); });
  const gone = state.posts.filter(p => !p.slides.length).length;
  state.posts = state.posts.filter(p => p.slides.length);
  ids.forEach(id => {
    delete state.photos[id]; delImg(id); localKeys.delete(id);
    if(thumbs[id] && !thumbs[id].startsWith("http")) URL.revokeObjectURL(thumbs[id]);
    delete thumbs[id]; delete fullURLs[id];
  });
  boardSel.clear(); save(); renderBoard();
  toast(`${ids.length} Fotos gelöscht` + (gone ? `, ${gone} leere Karussells entfernt` : ""));
}

// Karussell so anzeigen wie in Instagram
function igPreview(p){
  let i = 0, ratio = "4/5";
  const ov = document.createElement("div"); ov.className = "igprev";
  ov.innerHTML = `<div><div class="igcard"><div class="igtop"><i></i><span class="sp"></span><button id="ipRatio"></button></div>
    <div class="igslide" id="ipSlide"><span class="cnt"></span><button class="nav prev" aria-label="Zurück">‹</button><button class="nav next" aria-label="Weiter">›</button></div>
    <div class="igdots"></div><div class="igcap"></div></div><button class="igclose">Schließen</button></div>`;
  ov.querySelector(".sp").textContent = state.ig && state.ig.user ? state.ig.user : "dein_profil";
  ov.querySelector(".igcap").textContent = p.caption || "(noch keine Caption)";
  const sl = ov.querySelector("#ipSlide"), dots = ov.querySelector(".igdots");
  const show = () => {
    const s = p.slides[i];
    sl.style.aspectRatio = ratio; sl.style.backgroundPosition = `${s.fx * 100}% ${s.fy * 100}%`;
    fullURL(s.pid).then(u => { if(u) sl.style.backgroundImage = `url("${u}")`; });
    ov.querySelector(".cnt").textContent = `${i + 1}/${p.slides.length}`;
    dots.innerHTML = p.slides.map((_, k) => `<span class="${k === i ? "on" : ""}"></span>`).join("");
    ov.querySelector(".prev").hidden = i === 0; ov.querySelector(".next").hidden = i === p.slides.length - 1;
    ov.querySelector("#ipRatio").textContent = ratio === "4/5" ? "4:5" : "3:4";
  };
  const go = d => { i = Math.max(0, Math.min(p.slides.length - 1, i + d)); show(); };
  ov.querySelector(".prev").onclick = () => go(-1);
  ov.querySelector(".next").onclick = () => go(1);
  ov.querySelector("#ipRatio").onclick = () => { ratio = ratio === "4/5" ? "3/4" : "4/5"; show(); };
  let sx = null;
  sl.addEventListener("pointerdown", e => { sx = e.clientX; });
  sl.addEventListener("pointerup", e => { if(sx != null && Math.abs(e.clientX - sx) > 40) go(e.clientX < sx ? 1 : -1); sx = null; });
  const key = e => { if(e.key === "ArrowRight") go(1); if(e.key === "ArrowLeft") go(-1); if(e.key === "Escape") close(); };
  const close = () => { ov.remove(); document.removeEventListener("keydown", key); };
  document.addEventListener("keydown", key);
  ov.querySelector(".igclose").onclick = close;
  ov.addEventListener("click", e => { if(e.target === ov) close(); });
  show(); app.appendChild(ov);
}

/* ---------- Geräte-Sync über ein privates GitHub-Repo ---------- */
// Dort liegen state.json (Posts, Versionen, Instagram) und die Bilder der Posts unter img/.
// Unbenutzte Album-Fotos bleiben lokal. Es gewinnt der jüngere Stand (updatedAt).
let syncCfg = null, syncSha = null, syncReady = false, pushTimer = null, pushing = false, syncState = "";
const localKeys = new Set();
function syncLabel(){ return !syncCfg ? "" : syncState === "err" ? " · ☁︎ Sync-Fehler" : syncState === "busy" ? " · ☁︎ …" : " · ☁︎ synchron"; }
async function gh(path, opts = {}){
  return fetch(`https://api.github.com/repos/${syncCfg.repo}/${path}`, {
    method: opts.method || "GET", cache: "no-store", body: opts.body,
    headers: {Authorization: `Bearer ${syncCfg.token}`, Accept: opts.raw ? "application/vnd.github.raw" : "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
  });
}
const b64ToText = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, "")), c => c.charCodeAt(0)));
function textToB64(t){
  const bytes = new TextEncoder().encode(t); let bin = "";
  for(let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
  return btoa(bin);
}
const blobToB64 = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(b); });
async function putFile(path, b64, sha){
  return gh(`contents/${path}`, {method: "PUT", body: JSON.stringify({message: "Grid Studio Sync", content: b64, ...(sha ? {sha} : {})})});
}
async function pullImg(pid){
  if(!syncCfg) return null;
  try{
    const get = async k => { const r = await gh(`contents/img/${pid}.${k}.jpg`, {raw: true}); return r.ok ? new Blob([await r.arrayBuffer()], {type: "image/jpeg"}) : null; };
    const [thumb, full] = await Promise.all([get("t"), get("f")]);
    if(!thumb && !full) return null;
    const rec = {thumb: thumb || full, full: full || thumb};
    await putImg(pid, rec); localKeys.add(pid);
    return rec;
  }catch(e){ return null; }
}
async function readRemote(){
  const r = await gh("contents/state.json");
  if(r.status === 404) return null;
  if(!r.ok) throw new Error("GitHub antwortet " + r.status);
  const j = await r.json();
  syncSha = j.sha;
  let text = j.content ? b64ToText(j.content) : "";
  if(!text){ const raw = await gh("contents/state.json", {raw: true}); text = await raw.text(); }
  return JSON.parse(text);
}
// Entfernten Stand übernehmen, eigene nur-lokale Alben und Geräte-Einstellungen behalten
function applyRemote(rs){
  const keep = {};
  for(const id of Object.keys(state.photos)){
    const ph = state.photos[id];
    if(!rs.photos[id] && !ph.remote && localKeys.has(id)) keep[id] = ph;
  }
  const albums = [...rs.albums];
  state.albums.forEach(a => { if(!albums.some(x => x.id === a.id) && Object.values(keep).some(ph => ph.album === a.id)) albums.push(a); });
  const local = {current: state.current, board: state.board, view: state.view};
  state = Object.assign({}, rs, {photos: Object.assign({}, rs.photos, keep), albums});
  state.current = albums.some(a => a.id === local.current) ? local.current : (albums[0] ? albums[0].id : null);
  state.board = local.board;
  state.view = local.view === "new" || (state.layouts || []).some(l => l.id === local.view) ? local.view : state.view;
  ensureLayouts();
  save(true);
  renderAlbums(); renderViews(); renderGrid(); renderStrip();
  if(openPost && !postById(openPost.id)) closeSheet();
}
async function syncPull(){
  if(!syncCfg) return;
  try{
    syncState = "busy"; renderStats();
    const rs = await readRemote();
    syncReady = true;
    if(rs && (rs.updatedAt || 0) > (state.updatedAt || 0)) applyRemote(rs);
    else if(!rs || (rs.updatedAt || 0) < (state.updatedAt || 0)) schedulePush(true);
    syncState = "";
  }catch(e){ syncState = "err"; }
  syncReady = true; renderStats();
}
function schedulePush(now){
  if(!syncCfg || !syncReady) return;
  clearTimeout(pushTimer); pushTimer = setTimeout(syncPush, now ? 50 : 2500);
}
async function syncPush(){
  if(!syncCfg || pushing) return;
  pushing = true; syncState = "busy"; renderStats();
  try{
    // Erst fehlende Bilder der Posts hochladen
    const need = new Set();
    state.posts.forEach(p => p.slides.forEach(sl => { const ph = state.photos[sl.pid]; if(ph && !ph.remote && !ph.synced) need.add(sl.pid); }));
    for(const pid of need){
      const rec = await getImg(pid);
      if(!rec) continue;
      const okT = await putFile(`img/${pid}.t.jpg`, await blobToB64(rec.thumb || rec.full));
      const okF = await putFile(`img/${pid}.f.jpg`, await blobToB64(rec.full || rec.thumb));
      if((okT.ok || okT.status === 422) && (okF.ok || okF.status === 422)) state.photos[pid].synced = true;
    }
    // Nur Fotos mitschicken, die auch woanders verfügbar sind
    const out = JSON.parse(JSON.stringify(state));
    out.photos = Object.fromEntries(Object.entries(state.photos).filter(([, ph]) => ph.remote || ph.synced));
    out.albums = state.albums.filter(a => Object.values(out.photos).some(ph => ph.album === a.id));
    delete out.board; delete out.current;
    let r = await putFile("state.json", textToB64(JSON.stringify(out)), syncSha);
    if(r.status === 409 || r.status === 422){
      // Jemand war schneller: neu laden und entscheiden, wer jünger ist
      const rs = await readRemote();
      if(rs && (rs.updatedAt || 0) > (state.updatedAt || 0)){ applyRemote(rs); r = {ok: true, json: async () => ({content: {sha: syncSha}})}; }
      else r = await putFile("state.json", textToB64(JSON.stringify(out)), syncSha);
    }
    if(!r.ok) throw new Error("Upload fehlgeschlagen");
    const j = await r.json(); if(j.content && j.content.sha) syncSha = j.content.sha;
    save(true);
    syncState = "";
  }catch(e){ syncState = "err"; }
  pushing = false; renderStats();
}
async function syncConnect(token, repo){
  syncCfg = {token, repo};
  const r = await gh("");
  if(r.status === 404 || r.status === 401 || r.status === 403){ syncCfg = null; throw new Error(r.status === 404 ? "Repo nicht gefunden oder der Token darf nicht darauf zugreifen." : "Der Token wird nicht akzeptiert."); }
  await idb("kv", "readwrite", s => s.put(JSON.stringify(syncCfg), "sync"));
  syncReady = false; await syncPull();
}

/* ---------- Übertragen & Sichern ---------- */
// Dateiformat: Kennung, Länge des Kopfs, Kopf (JSON mit Zustand und Bildverzeichnis), danach die Bilder als Rohdaten.
const MAGIC = "GRIDSTUDIO1\n";
async function exportBackup(withAll){
  const used = usedIds();
  const keep = Object.keys(state.photos).filter(id => withAll || used.has(id) || state.photos[id].fav || state.photos[id].remote);
  toast("Datei wird erstellt …");
  const parts = [], index = {};
  let off = 0;
  for(const id of keep){
    const rec = await getImg(id);
    if(!rec) continue;
    index[id] = {};
    for(const k of ["full", "thumb"]){
      if(!rec[k]) continue;
      index[id][k] = [off, rec[k].size, rec[k].type];
      parts.push(rec[k]); off += rec[k].size;
    }
  }
  const st = JSON.parse(JSON.stringify(state));
  st.photos = Object.fromEntries(keep.map(id => [id, state.photos[id]]));
  const head = JSON.stringify({state: st, index, sync: syncCfg && {token: syncCfg.token, repo: syncCfg.repo}});
  const headBytes = new TextEncoder().encode(head);
  const blob = new Blob([MAGIC, String(headBytes.length).padStart(12, "0"), headBytes, ...parts], {type: "application/octet-stream"});
  const file = new File([blob], `Grid Studio ${new Date().toISOString().slice(0, 10)}.gridstudio`, {type: "application/octet-stream"});
  try{
    if(navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file]}); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const u = URL.createObjectURL(file), a = document.createElement("a");
  a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60e3);
  toast(`Gespeichert: ${file.name} (${Math.round(file.size / 1048576)} MB)`);
}
async function importBackup(file){
  try{
    const magic = await file.slice(0, MAGIC.length).text();
    if(magic !== MAGIC) throw new Error("Das ist keine Grid-Studio-Datei.");
    const len = parseInt(await file.slice(MAGIC.length, MAGIC.length + 12).text(), 10);
    const start = MAGIC.length + 12;
    const {state: st, index, sync: sc} = JSON.parse(await file.slice(start, start + len).text());
    const base = start + len;
    toast("Wird übernommen …");
    for(const id of Object.keys(index)){
      const rec = {};
      for(const k of Object.keys(index[id])){ const [o, l, t] = index[id][k]; rec[k] = file.slice(base + o, base + o + l, t); }
      // Als echte Blobs speichern, damit sie unabhängig von der Datei bleiben
      if(rec.full) rec.full = new Blob([await rec.full.arrayBuffer()], {type: rec.full.type});
      if(rec.thumb) rec.thumb = new Blob([await rec.thumb.arrayBuffer()], {type: rec.thumb.type});
      await putImg(id, rec);
    }
    await idb("kv", "readwrite", s => s.put(JSON.stringify(st), "state"));
    if(sc && sc.token) await idb("kv", "readwrite", s => s.put(JSON.stringify(sc), "sync"));
    location.reload();
  }catch(e){ toast(e.message || "Datei konnte nicht gelesen werden"); }
}
function transferDialog(){
  const back = document.createElement("div"); back.className = "dialog-back";
  const close = () => back.remove();
  back.addEventListener("click", e => { if(e.target === back) close(); });
  const host = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "";
  const syncHtml = syncCfg
    ? `<b>Geräte-Sync ist an</b><p>Verbunden mit <b>${syncCfg.repo.replace(/[<>&"]/g, "")}</b>. Änderungen landen nach ein paar Sekunden auf allen Geräten, auf denen Grid Studio verbunden ist.${syncState === "err" ? " <span class='err'>Letzter Sync ist fehlgeschlagen.</span>" : ""}</p>
       <div class="stackbtns"><button class="btn primary" id="sNow">Jetzt synchronisieren</button><button class="btn warn" id="sOff">Sync auf diesem Gerät ausschalten</button></div><hr style="border:0;border-top:1px solid var(--line);width:100%">`
    : `<b>Geräte immer synchron halten</b>
       <p>Einmal pro Gerät einrichten (ca. 3 Minuten). Dein Stand liegt dann in einem privaten Repo in deinem GitHub-Konto, kein Abo.</p>
       <ol class="steps">
         <li><a href="https://github.com/new?name=grid-studio-data&visibility=private" target="_blank" rel="noopener">Privates Repo anlegen ↗</a><br>Name <b>grid-studio-data</b>, <b>Private</b>, „Add README“ an → Create.</li>
         <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Zugangsschlüssel erstellen ↗</a><br>Name „Grid Studio“, Ablauf <b>No expiration</b> (oder 1 Jahr). Bei „Repository access“ <b>Only select repositories → grid-studio-data</b>. Bei „Permissions“ → <b>Contents: Read and write</b>. Dann „Generate token“ und kopieren.</li>
         <li>Hier einfügen:</li>
       </ol>
       <input id="sTok" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" aria-label="GitHub-Token">
       <input id="sRepo" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Repo" value="${host ? host + "/grid-studio-data" : ""}" placeholder="dein-name/grid-studio-data">
       <p class="err" id="sErr"></p>
       <div class="stackbtns"><button class="btn primary" id="sGo">Sync einschalten</button></div>
       <p>Auf dem zweiten Gerät dasselbe einfügen. Oder unten eine Datei erstellen und dort übernehmen, dann kommt der Zugang mit.</p><hr style="border:0;border-top:1px solid var(--line);width:100%">`;
  back.innerHTML = `<div class="dialog wide">${syncHtml}<b>Per Datei übertragen oder sichern</b>
    <p>Grid Studio speichert alles nur auf dem Gerät, auf dem du es benutzt. So kommt dein Stand aufs andere Gerät: hier eine Datei erstellen, per AirDrop schicken, dort öffnen und übernehmen. Die Instagram-Verbindung kommt mit.</p>
    <div class="stackbtns">
      <button class="btn primary" id="tPlan">Datei erstellen: Planung<small>Versionen, Karussells, Instagram, Favoriten. Ohne unbenutzte Album-Fotos, daher klein.</small></button>
      <button class="btn" id="tAll">Datei erstellen: alles<small>Inklusive aller Album-Fotos. Kann bei einer ganzen Hochzeit groß werden.</small></button>
      <button class="btn" id="tIn">Datei übernehmen<small>Ersetzt alles auf diesem Gerät durch den Stand aus der Datei.</small></button>
      <button class="btn" id="tClose">Schließen</button>
    </div></div>`;
  const sNow = back.querySelector("#sNow");
  if(sNow) sNow.onclick = async () => { close(); await syncPull(); await syncPush(); toast(syncState === "err" ? "Sync fehlgeschlagen" : "Synchronisiert"); };
  const sOff = back.querySelector("#sOff");
  if(sOff) sOff.onclick = async () => {
    if(!sOff.dataset.armed){ sOff.dataset.armed = "1"; sOff.textContent = "Sicher? Nochmal tippen"; return; }
    syncCfg = null; await idb("kv", "readwrite", s => s.delete("sync")); renderStats(); close(); toast("Sync ausgeschaltet");
  };
  const sGo = back.querySelector("#sGo");
  if(sGo) sGo.onclick = async () => {
    const tok = back.querySelector("#sTok").value.trim(), repo = back.querySelector("#sRepo").value.trim().replace(/^https:\/\/github\.com\//, "").replace(/\/$/, "");
    const err = back.querySelector("#sErr");
    if(tok.length < 20 || !/^[\w.-]+\/[\w.-]+$/.test(repo)){ err.textContent = "Bitte Token und Repo (name/grid-studio-data) eintragen."; return; }
    sGo.disabled = true; sGo.textContent = "Verbinde …"; err.textContent = "";
    try{ await syncConnect(tok, repo); close(); toast("Sync ist an"); }
    catch(e){ err.textContent = e.message; sGo.disabled = false; sGo.textContent = "Sync einschalten"; }
  };
  back.querySelector("#tPlan").onclick = () => { close(); exportBackup(false); };
  back.querySelector("#tAll").onclick = () => { close(); exportBackup(true); };
  back.querySelector("#tIn").onclick = e => {
    const b = e.currentTarget;
    if(state.posts.length && !b.dataset.armed){ b.dataset.armed = "1"; b.firstChild.textContent = "Ersetzt alles hier. Nochmal tippen zum Auswählen"; return; }
    close(); $("#fileBackup").click();
  };
  back.querySelector("#tClose").onclick = close;
  app.appendChild(back);
}
$("#transferBtn").onclick = transferDialog;
$("#fileBackup").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if(f) importBackup(f); });

/* ---------- Start ---------- */
(async () => {
  db = await openDB();
  try{
    const raw = await idb("kv", "readonly", s => s.get("state"));
    if(raw){ const s = JSON.parse(raw); if(s && Array.isArray(s.posts)) state = Object.assign(state, s); }
  }catch(e){}
  // Aufräumen: Posts ohne vorhandene Bilder entfernen
  const keys = new Set(await allImgKeys() || []);
  if(db){
    for(const id of Object.keys(state.photos)) if(!keys.has(id) && !state.photos[id].remote && !state.photos[id].synced) delete state.photos[id];
    state.posts.forEach(p => p.slides = p.slides.filter(s => state.photos[s.pid]));
    state.posts = state.posts.filter(p => p.slides.length);
  }
  if(state.current && !state.albums.some(a => a.id === state.current)) state.current = state.albums[0] ? state.albums[0].id : null;
  if(!db) toast("Speichern nicht möglich: Daten gehen beim Schließen verloren");
  ensureLayouts();
  renderAlbums(); renderStrip(); setupSortable(); renderViews(); renderGrid();
  if(state.board) setBoard(true);
  (await allImgKeys() || []).forEach(k => localKeys.add(k));
  try{ const sc = await idb("kv", "readonly", s => s.get("sync")); if(sc) syncCfg = JSON.parse(sc); }catch(e){}
  // Reihenfolge wichtig: zuerst den neuesten Stand holen, dann erst Instagram prüfen (das speichert)
  const refresh = async () => { await syncPull(); igAuto(); };
  refresh();
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible") refresh();
    else if(pushTimer){ clearTimeout(pushTimer); syncPush(); }
  });
  setInterval(() => { if(document.visibilityState === "visible" && syncCfg && !pushing) syncPull(); }, 45e3);
})();
})();
